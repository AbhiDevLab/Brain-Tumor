name: Tests

on:
  push:
  pull_request:

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
      - name: Compile Python files
        run: python -m compileall -q app.py audit_dataset.py audit_brisc.py train_classifier.py train_segmenter.py evaluate_classifier.py evaluate_segmenter.py src tests
      - name: Run tests
        run: pytest -q
