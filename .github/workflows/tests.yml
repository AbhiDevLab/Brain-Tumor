name: Tests

on:
  push:
  pull_request:

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install CPU-only PyTorch and project dependencies
        run: |
          python -m pip install --upgrade pip
          pip install --index-url https://download.pytorch.org/whl/cpu "torch>=2.2,<3.0" "torchvision>=0.17,<1.0"
          pip install -r requirements-dev.txt
      - name: Compile Python files
        run: python -m compileall -q app.py audit_dataset.py audit_brisc.py prepare_brisc.py train_classifier.py train_segmenter.py evaluate_classifier.py evaluate_segmenter.py src tests
      - name: Run tests
        run: pytest -q

  real-checkpoint-inference:
    # Only download private model artifacts for this dedicated deployment branch.
    if: github.ref == 'refs/heads/feature/online-mri-research-platform' || (github.event_name == 'pull_request' && github.event.pull_request.head.ref == 'feature/online-mri-research-platform')
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
    env:
      # Ephemeral repository-scoped token; never printed or available to the web app.
      BRAIN_MRI_GITHUB_TOKEN: ${{ secrets.BRAIN_MRI_GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - name: Check private draft-release token configuration
        run: |
          if [ -z "$BRAIN_MRI_GITHUB_TOKEN" ]; then
            echo "::error::Add repository Actions secret BRAIN_MRI_GITHUB_TOKEN using a fine-grained token limited to this repository with Contents: Read-only permission."
            exit 1
          fi
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install CPU-only PyTorch and inference dependencies
        run: |
          python -m pip install --upgrade pip
          pip install --index-url https://download.pytorch.org/whl/cpu "torch>=2.2,<3.0" "torchvision>=0.17,<1.0"
          pip install -r requirements-dev.txt
      - name: Compile deployment code
        run: python -m compileall -q app.py src scripts tests
      - name: Download pinned release assets, verify SHA-256, and run real-weight smoke inference
        run: python scripts/checkpoint_smoke.py
